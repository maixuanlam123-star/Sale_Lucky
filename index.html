                className: `px-2.5 py-1 md:px-3 md:py-1.5 rounded-lg border text-xs md:text-sm text-left leading-tight transition ${on ? 'border-amber-500 bg-amber-50 ring-2 ring-amber-300' : q > 0 ? 'bg-white hover:bg-slate-50' : 'bg-slate-50 text-slate-400'}` },
                h('div', { className: 'font-bold' }, c.code),
                h('div', { className: `text-xs font-semibold ${q > 0 ? 'text-emerald-700' : q < 0 ? 'text-rose-600' : 'text-slate-400'}` }, dayText(q)),
                h('div', { className: 'text-[11px] text-slate-400' }, `${fmt(q)} quả`));
        })));
    // Ô "hiện tại → sau phiếu này còn"
    // Đã bỏ ô xanh "Tồn kho → Sau phiếu này còn" theo yêu cầu. Tồn kho vẫn xem ở bảng ô loại trứng đầu form;
    // gõ quá số đang có thì vẫn hiện dòng đỏ "Không đủ hàng" và khóa nút Lưu.
    const afterBox = () => null;
    // Chọn đơn vị Dây / Quả: 2 nút bấm (thay ô xổ xuống của trình duyệt)
    const unitToggle = (val, onPick, cls) => h('div', { role: 'group', 'aria-label': 'Đơn vị', className: `h-11 flex rounded-xl border border-slate-200 bg-slate-100 p-0.5 gap-0.5 ${cls || ''}` },
        [['day', 'Dây'], ['qua', 'Quả']].map(([v, t]) => h('button', { key: v, type: 'button', 'aria-pressed': val === v, onClick: () => onPick(v),
            className: `flex-1 px-2 rounded-[10px] text-sm font-bold transition ${val === v ? 'bg-amber-500 text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-white'}` }, t)));
    const unlinked = useMemo(() => findUnlinked(db), [db]);
    const catNameOf = r => { const c = recCat(L, r); return c ? catLabelOf(c) : r.itemType; };
    let recMap = null;
    const recById = id => { if (!recMap) { recMap = {}; records.forEach(x => { recMap[String(x.id)] = x; }); } return recMap[String(id)]; };
    const orderCusName = r => { const c = r.orderCustomerId ? L.cus.byId[String(r.orderCustomerId)] : null; return c ? c.name : (r.orderCustomer || ''); };
    const partnerNameOf = r => {
        // Trả hàng theo phiếu giao: hiện khách nào trả + từ phiếu giao nào
        if (r.type === 'nopve' && r.orderId) { const o = recById(r.orderId), cn = orderCusName(r);
            return [cn ? 'Khách trả: ' + cn : '', o ? 'từ phiếu ' + (o.ticketNo || '') : ''].filter(Boolean).join(' · '); }
        if (r.type === 'xuatnv') { const cn = orderCusName(r); return cn ? 'Giao: ' + cn : ''; }
        if (r.type === 'giaokhach' && r.orderId) { const p = recPartner(L, r), o = recById(r.orderId); return (p ? p.name : r.partner) + (o ? ' · phiếu ' + (o.ticketNo || '') : ''); }
        const p = recPartner(L, r); return p ? p.name : r.partner;
    };
    const staffNameOf = r => { const s = recStaff(L, r); return s ? s.name : r.staff; };
    const payNameOf = p => { const m = payPartner(L, p); return m ? m.name : p.partnerName; };

    // Làm việc riêng 1 kho: ẩn các mục chung toàn công ty
    const COMPANY_ONLY_TABS = ['dongtien', 'doanhthu', 'taikhoan', 'cauhinh'];
    const visibleTabs = user ? TABS.filter(t => t.roles.includes(user.role) && !(SW && COMPANY_ONLY_TABS.includes(t.id))) : [];
    useEffect(() => {
        if (user && activeTab !== 'home' && !visibleTabs.some(t => t.id === activeTab)) setActiveTab('home');
    }, [user && user.role, activeTab]);

    /* ---------- Phiếu nhập / xuất ---------- */
    // NCC dùng được cho kho wh (giữ lại NCC của phiếu đang sửa để không mất dữ liệu cũ)
    const suppliersFor = (wh, oldRec) => suppliers.filter(sp => supplierServes(sp, wh) || (oldRec && oldRec.type === 'nhap' && idOf(recPartner(L, oldRec)) === String(sp.id)));
    const ticketPartnerId = (wh, oldRec) => { const list = suppliersFor(wh, oldRec); return list.some(sp => String(sp.id) === String(formData.partnerId)) ? String(formData.partnerId) : idOf(list[0]); };
    const blankTicket = type => ({
        id: null,
        ticketNo: generateTicketNo(type, records),
        date: todayStr(),
        warehouseId: defaultWh(),
        categoryId: idOf(categories[0]),
        partnerId: idOf(type === 'nhap' ? suppliers[0] : customers[0]),
        staffId: '',
        price: '', notes: ''
    });
    const openTab = id => {
        if (id === 'nhap' || id === 'xuat') { setFormData(blankTicket(id)); setInputQty(''); }
        if (id === 'khohang') { setOverviewStartDate(todayStr()); setOverviewEndDate(todayStr()); } // vào Kho Hàng: luôn mở ngày hôm nay
        const gBase = ghModal ? ghModal.prev : ghForm;
        if (ghModal) { setGhModal(null); setGhForm(gBase); }
        setActiveTab(id);
        setMobileNav(false);
    };

    const ticketType = () => activeTab === 'xuat' && formData.toStaff ? 'xuatnv' : activeTab;
    const calculatedTotalQua = () => { const v = parseVNNumber(inputQty); return inputMode === 'day' ? v * EGGS_PER_DAY : v; };
    const calculatedTotalPrice = () => ticketType() === 'xuatnv' ? 0 : calculatedTotalQua() * parseVNNumber(formData.price);

    const getStockForCategory = (catId, excludeId) => stockKho(records, L, catId, excludeId, true, (SW || formData.warehouseId) || defaultWh());
    const savedNote = it => !isApproved(it) ? ' — đang chờ quản trị viên duyệt' : '';

    const handleSubmit = async e => {
        e.preventDefault();
        const type = ticketType();
        if (type === 'xuatnv' && !L.staff.byId[String(formData.staffId)]) { showToast('Vui lòng chọn nhân viên nhận hàng', 'error'); return; }
        const qtyNum = calculatedTotalQua();
        const priceNum = type === 'xuatnv' ? 0 : parseVNNumber(formData.price);
        const cat = L.cat.byId[String(formData.categoryId)];
        if (!cat) { showToast('Vui lòng chọn loại trứng (thêm ở mục Quản Lý Thông Tin nếu chưa có).', 'error'); return; }
        if (qtyNum <= 0) { showToast('Số lượng phải lớn hơn 0!', 'error'); return; }
        {
            const old = records.find(r => String(r.id) === String(formData.id));
            const draft = { ...(old || {}), id: formData.id || '__new__', type, date: formData.date || todayStr(), warehouseId: (SW || formData.warehouseId), categoryId: String(cat.id), quantity: qtyNum };
            if (!L.wh.byId[String((SW || formData.warehouseId))]) { showToast('Vui lòng chọn kho', 'error'); return; }
            const err = stockError(draft, records, L, true) || (old ? timelineError(records, L, draft, old, true) : null);
            if (err) { showToast(err, 'error'); return; }
        }
        const oldT = records.find(r => String(r.id) === String(formData.id));
        const partner = type === 'xuatnv' ? null : (type === 'nhap' ? L.sup : L.cus).byId[String(type === 'nhap' ? ticketPartnerId(String(SW || formData.warehouseId), oldT) : formData.partnerId)];
        if (type === 'nhap' && !partner && suppliers.length) { showToast(`Chưa có nhà cung cấp nào cung cấp cho ${whName(L, SW || formData.warehouseId)}`, 'error'); return; }
        const staff = L.staff.byId[String(formData.staffId)];
        const item = {
            id: formData.id || undefined,
            ticketNo: (formData.ticketNo || '').trim(),
            date: formData.date || todayStr(),
            type,
            typeLabel: REC_TYPES[type].label,
            warehouseId: String((SW || formData.warehouseId)),
            categoryId: String(cat.id),
            itemType: catLabelOf(cat),
            inputMode,
            inputQty: parseVNNumber(inputQty),
            quantity: qtyNum,
            price: priceNum,
            totalPrice: qtyNum * priceNum,
            partnerId: idOf(partner),
            partner: partner ? partner.name : (type === 'xuatnv' ? '' : 'Khách lẻ'),
            staffId: idOf(staff),
            staff: staff ? staff.name : 'N/A',
            notes: formData.notes || ''
        };
        const saved = await saveItem('records', item);
        if (!saved) return;
        rememberWh((SW || formData.warehouseId));
        if (formData.id) {
            showToast(`Đã cập nhật phiếu ${saved.ticketNo}${savedNote(saved)}!`);
            setFormData(blankTicket(activeTab));
            if (activeTab !== 'nhap') setActiveTab('nhatky'); // sửa phiếu nhập: ở lại trang Phiếu Nhập (có danh sách)
        } else {
            showToast(`Đã lưu phiếu ${saved.ticketNo}${savedNote(saved)}!`);
            setFormData(prev => ({ ...prev, id: null, ticketNo: generateTicketNo(type, [saved, ...records]), price: '', notes: '' })); // giữ chế độ xuất bán / xuất cho NV
            setInputQty('');
        }
    };

    const handleEditRecord = r => {
        if (r.type === 'xuatnv') { handleEditGh(r, false); return; }
        if (STAFF_TYPES.includes(r.type)) { handleEditGh(r, false); return; }
        if (r.type === 'chuyenkho') { handleEditCk(r); return; }
        setInputMode(r.inputMode || 'qua');
        setInputQty(String(r.inputQty || r.quantity || ''));
        setFormData({ id: r.id, ticketNo: r.ticketNo, date: r.date, warehouseId: whOf(r), categoryId: idOf(recCat(L, r)), partnerId: idOf(recPartner(L, r)), staffId: idOf(recStaff(L, r)), price: String(r.price || ''), notes: r.notes || '' });
        setActiveTab(r.type);
    };

    /* ---------- Chi phí / Dòng tiền / Thanh toán ---------- */
    // Sổ quỹ: Thu -> bảng Dòng tiền (thu khác); Chi -> bảng Chi phí (tính vào lãi/lỗ). Tên khoản do người dùng tự nhập
    const handleSaveCashflow = async e => {
        e.preventDefault();
        if (!String(cashForm.category || '').trim()) { showToast(`Nhập tên khoản ${cashForm.flowType === 'out' ? 'chi' : 'thu'}`, 'error'); return; }
        if (cashForm.flowType === 'out' && cashForm.src !== 'cf') {
            const f = { ...cashForm, category: String(cashForm.category).trim() }, amt = parseVNNumber(f.amount);
            if (amt <= 0) { showToast('Số tiền chi phí phải lớn hơn 0!', 'error'); return; }
            const saved = await saveItem('expenses', { id: (f.src === 'exp' && f.id) || undefined, warehouseId: SW || f.warehouseId || '', date: f.date || todayStr(), category: f.category,
                amount: amt, bankAmount: pmBankOf(f, amt), payee: f.party || 'N/A', notes: f.notes || '' });
            if (saved) { showToast(f.id ? 'Đã cập nhật khoản chi!' : 'Đã ghi khoản chi!'); setCashForm({ ...blankCash, flowType: 'out' }); }
            return;
        }
        const amt = parseVNNumber(cashForm.amount);
        if (amt <= 0) { showToast('Số tiền giao dịch phải lớn hơn 0!', 'error'); return; }
        const saved = await saveItem('cashflows', { id: cashForm.id || undefined, date: cashForm.date || todayStr(), flowType: cashForm.flowType, category: String(cashForm.category).trim(), amount: amt, bankAmount: pmBankOf(cashForm, amt), party: cashForm.party || 'N/A', notes: cashForm.notes || '' });
        if (saved) { showToast(cashForm.id ? 'Đã cập nhật!' : 'Đã ghi khoản thu!'); setCashForm(blankCash); }
    };

    // Ô chọn phương thức thanh toán: Tiền mặt / Chuyển khoản / Cả hai (nhập phần chuyển khoản, tiền mặt tự tính)
    const pmField = (total, f, set, label, note) => {
        const mode = f.pmMode || 'cash', t = num(total), bank = pmBankOf(f, t), over = mode === 'mix' && parseVNNumber(f.pmBank) > t;
        return h('div', null, lbl(label || 'Phương thức thanh toán'),
            h('div', { className: 'grid grid-cols-3 gap-1 rounded-xl border p-1 bg-slate-50' },
                [['cash', 'Tiền mặt', 'fa-money-bill-wave'], ['bank', 'Chuyển khoản', 'fa-building-columns'], ['mix', 'Cả hai', 'fa-scale-balanced']].map(([m, tx, ic]) =>
                    h('button', { key: m, type: 'button', onClick: () => set({ pmMode: m }), 'aria-pressed': mode === m,
                        className: `py-2 px-1 rounded-lg text-sm font-bold ${mode === m ? 'bg-white shadow text-emerald-700 ring-2 ring-emerald-400' : 'text-slate-500'}` }, h('i', { className: 'fas ' + ic + ' mr-1' }), tx))),
            mode === 'mix' ? h('div', { className: 'grid grid-cols-2 gap-2 mt-2' },
                h('div', null, h('span', { className: 'text-xs font-semibold text-slate-500' }, 'Chuyển khoản (đ)'),
                    h('input', { type: 'text', inputMode: 'numeric', placeholder: '0', 'data-pm': 'bank', value: formatVNNumberInput(f.pmBank || ''), onChange: e => set({ pmBank: e.target.value }), className: INP + ' font-bold text-sky-700' })),
                h('div', null, h('span', { className: 'text-xs font-semibold text-slate-500' }, 'Tiền mặt (đ)'),
                    h('div', { className: 'p-3 rounded-xl bg-slate-100 font-bold text-emerald-700' }, fmt(t - bank)))) : null,
            over ? h('p', { className: 'text-xs font-semibold text-rose-600 mt-1' }, `Tiền chuyển khoản lớn hơn tổng ${fmt(t)} đ — sẽ tính là chuyển khoản toàn bộ`) : null,
            t > 0 ? h('p', { className: 'text-xs text-slate-500 mt-1' }, `Tiền mặt ${fmt(t - bank)} đ · Chuyển khoản ${fmt(bank)} đ`, note ? ' — ' + note : '') : null);
    };
    // Kho mặc định khi thu/trả tiền: kho đang làm việc, kho đã chọn, hoặc kho đối tác đang nợ nhiều nhất
    const payWhOf = pm => {
        if (SW) return SW;
        if (pm.warehouseId && L.wh.byId[String(pm.warehouseId)]) return String(pm.warehouseId);
        if (!pm.partnerId) return idOf(warehouses[0]);
        const d = partnerDebtWh(pm.type, pm.partnerId, pm.id);
        const best = warehouses.map(w => String(w.id)).sort((a, b) => (d[b] || 0) - (d[a] || 0))[0];
        return best || idOf(warehouses[0]);
    };
    const paySelTotal = pm => Object.values(pm.sel || {}).reduce((a, v) => a + parseVNNumber(v), 0);
    const handleSavePayment = async e => {
        e.preventDefault();
        const selKeys = Object.keys(payModal.sel || {});
        if (!payModal.id && payModal.type === 'customer' && selKeys.length) {
            const partner = L.cus.byId[String(payModal.partnerId)];
            if (!partner) { showToast('Khách hàng không còn tồn tại trong danh mục', 'error'); return; }
            const open = openOrdersOf(partner.id), byKey = {}; open.forEach(o => { byKey[o.key] = o; });
            const items = selKeys.map(k => ({ o: byKey[k], amt: parseVNNumber(payModal.sel[k]) })).filter(x => x.o);
            if (!items.length || items.some(x => x.amt <= 0)) { showToast('Số tiền thu của mỗi đơn phải lớn hơn 0', 'error'); return; }
            const bad = items.find(x => x.amt > x.o.left);
            if (bad) { showToast(`Đơn ${bad.o.no} chỉ còn ${fmt(bad.o.left)} đ`, 'error'); return; }
            const total = items.reduce((a, x) => a + x.amt, 0);
            let bankLeft = pmBankOf(payModal, total);
            for (const x of items) {
                const bank = Math.min(bankLeft, x.amt); bankLeft -= bank;
                const saved = await saveItem('payments', { date: payModal.date || todayStr(), partnerId: String(partner.id), partnerName: partner.name, type: 'customer', amount: x.amt,
                    orderNo: x.o.key, notes: payModal.notes && payModal.notes !== 'Thu tiền khách hàng' ? payModal.notes : `Thu tiền đơn ${x.o.no}`, staffId: '', debtStaffId: 'none', warehouseId: payModal.warehouseId || '', bankAmount: bank });
                if (!saved) return;
            }
            showToast(`Đã thu ${fmt(total)} đ cho ${items.length} đơn`); setPayModal(blankPay); return;
        }
        const amt = parseVNNumber(payModal.amount);
        if (amt <= 0) { showToast('Số tiền thanh toán phải lớn hơn 0!', 'error'); return; }
        const partner = (payModal.type === 'supplier' ? L.sup : L.cus).byId[String(payModal.partnerId)];
        if (!partner) { showToast('Đối tác không còn tồn tại trong danh mục', 'error'); return; }
        const saved = await saveItem('payments', { id: payModal.id || undefined, date: payModal.date || todayStr(), partnerId: String(partner.id), partnerName: partner.name, type: payModal.type, amount: amt, notes: payModal.notes || 'Thanh toán công nợ',
            staffId: '', debtStaffId: payModal.type === 'customer' ? (payModal.debtStaffId || 'none') : '', warehouseId: multiWh ? payWhOf(payModal) : (payModal.warehouseId || ''),
            bankAmount: pmBankOf(payModal, amt) });
        if (saved) { showToast(payModal.id ? 'Đã cập nhật phiếu thanh toán!' : 'Đã ghi nhận thanh toán!'); setPayModal(blankPay); }
    };

    /* ---------- Phiếu giao hàng nhân viên ---------- */
    const myStaffId = user && user.role === 'giaohang' ? String(user.staffId || '') : '';
    const ghKinds = user ? Object.keys(GH_KINDS).filter(k => GH_KINDS[k].roles.includes(user.role)) : [];
    const freshGh = (kind, keep) => ({
        ...blankGh(kind, (keep && keep.staffId) || myStaffId || idOf(staffs[0])),
        date: (keep && keep.date) || todayStr(),
        categoryId: kind === 'nopve' ? '' : idOf(categories[0]),
        customerId: idOf(customers[0]),
        warehouseId: kind === 'giaokhach' ? lastStaffWh((keep && keep.staffId) || myStaffId || idOf(staffs[0])) : defaultWh()
    });

    const handleEditGh = (x, isPayment) => {
        if (isPayment) {
            setGhForm({ ...blankGh('thuno', String(x.staffId || '')), id: x.id, date: x.date, customerId: idOf(payPartner(L, x)), paid: String(x.amount || ''), notes: x.notes || '', debtStaffId: x.debtStaffId || '', ...pmFrom(x, x.amount) });
        } else {
            const inDay = x.inputMode === 'day';
            const paidMode = num(x.paidAmount) >= num(x.totalPrice) ? 'full' : num(x.paidAmount) === 0 ? 'none' : 'part';
            // NV sửa phiếu nộp tiền / trả hàng: mở hộp thoại ngay tại trang (tab Tạo phiếu chỉ còn Giao cho khách)
            const asPop = user && user.role === 'giaohang' && x.type === 'nopve';
            if (asPop) setGhModal({ prev: ghModal ? ghModal.prev : ghForm });
            setGhForm({
                ...blankGh(x.type, idOf(recStaff(L, x))), id: x.id, ticketNo: x.ticketNo, date: x.date,
                categoryId: idOf(recCat(L, x)), customerId: idOf(recPartner(L, x)),
                qtyMode: inDay ? 'day' : 'qua', qty: String(inDay ? (x.inputQty || '') : (x.quantity || '')),
                price: String(x.price || ''), payMode: x.type === 'giaokhach' ? paidMode : 'full',
                paid: String(x.paidAmount || ''), notes: x.notes || '', ...pmFrom(x, x.paidAmount), orderId: x.orderId ? String(x.orderId) : '',
                ...(x.type === 'nopve' ? { customerId: x.orderCustomerId ? String(x.orderCustomerId) : '', popMode: num(x.quantity) && num(x.paidAmount) ? '' : num(x.quantity) ? 'tra' : 'nop' } : {}),
                ...(x.type === 'xuatnv' ? { customerId: x.orderCustomerId ? String(x.orderCustomerId) : '', price: String(num(x.orderPrice) || ''), orderCollect: x.orderCollect === 'collect' ? 'collect' : 'none' } : {}),
                warehouseId: x.warehouseId ? String(x.warehouseId) : (x.type === 'nopve' && !num(x.quantity) ? '' : whOf(x))
            });
        }
        if (!isPayment && user && user.role === 'giaohang' && x.type === 'nopve') return;
        setActiveTab(user && user.role === 'giaohang' ? 'taophieugh' : 'giaohang');
    };

    /* ---------- Chuyển kho ---------- */
    const freshCk = keep => {
        const from = (keep && keep.from) || defaultWh();
        const to = (keep && keep.to && keep.to !== from) ? keep.to : idOf(warehouses.find(w => String(w.id) !== String(from)));
        return { ...blankCk(), date: (keep && keep.date) || todayStr(), from, to, categoryId: (keep && keep.categoryId) || idOf(categories[0]), qtyMode: (keep && keep.qtyMode) || 'day' };
    };
    const handleEditCk = r => {
        const inDay = r.inputMode === 'day';
        setCkForm({ ...blankCk(), id: r.id, ticketNo: r.ticketNo, date: r.date, from: whOf(r), to: String(r.toWarehouseId || ''), categoryId: idOf(recCat(L, r)),
            qtyMode: inDay ? 'day' : 'qua', qty: String(inDay ? (r.inputQty || '') : (r.quantity || '')), notes: r.notes || '' });
        setActiveTab('chuyenkho');
    };

    useEffect(() => {
        if (activeTab === 'chuyenkho' && loaded && !ckForm.id && !ckForm.from) setCkForm(freshCk());
    }, [activeTab, loaded, scope]);

    useEffect(() => {
        if (activeTab === 'taophieugh' && loaded && !ghForm.id && !ghModal && ghForm.kind !== 'giaokhach') setGhForm(freshGh('giaokhach', ghForm));
        else if ((activeTab === 'giaohang' || activeTab === 'taophieugh') && loaded && !ghForm.id && (!ghForm.staffId || !ghKinds.includes(ghForm.kind)) && ghKinds.length)
            setGhForm(freshGh(ghKinds.includes(ghForm.kind) ? ghForm.kind : ghKinds[0], ghForm));
    }, [activeTab, loaded, scope]);

    /* ---------- Duyệt phiếu ---------- */
    const TYPE_ORDER = { nhap: 0, chuyenkho: 1, xuatnv: 1, xuat: 2, giaokhach: 2, nopve: 3 };
    const pendingAll = useMemo(() => {
        const out = [];
        STATUS_COLS.forEach(col => (db[col] || []).forEach(x => { if (statusOf(x) === 'pending') out.push({ col, x, key: col + ':' + x.id }); }));
        // Duyệt theo thứ tự thời gian: nhập kho / phiếu giao cho khách (NV mang hàng đi) trước, NV xác nhận đã giao & trả hàng / nộp tiền sau
        return out.sort((a, b) => String(a.x.date).localeCompare(String(b.x.date)) ||
            ((TYPE_ORDER[a.x.type] ?? 1) - (TYPE_ORDER[b.x.type] ?? 1)) ||
            String(a.x.createdAt || '').localeCompare(String(b.x.createdAt || '')));
    }, [db.records, db.payments, db.expenses]);
    // Làm việc riêng 1 kho: chỉ hiện phiếu của kho đó (phiếu thu/trả tiền dùng chung nên vẫn hiện)
    const inScope = (col, x) => !SW || (col === 'records' ? (whOf(x) === SW || String(x.toWarehouseId || '') === SW) : col === 'expenses' ? String(x.warehouseId || '') === SW : true);
    const pendingItems = SW ? pendingAll.filter(it => inScope(it.col, it.x)) : pendingAll;

    /* ---------- Danh mục ---------- */
    const masterForm = col => masterForms[col] || (col === 'warehouses' && (db.warehouses || [])[0] ? { ...MASTER_DEFS.warehouses.blank, ...db.warehouses[0] } : MASTER_DEFS[col].blank);
    const setMasterForm = (col, v) => setMasterForms(prev => ({ ...prev, [col]: v }));
    const handleSaveMaster = async (e, col) => {
        e.preventDefault();
        const def = MASTER_DEFS[col];
        const form = masterForm(col);
        const missing = def.fields.find(f => f.req && !String(form[f.k] || '').trim());
        if (missing) { showToast(`Vui lòng nhập: ${missing.ph}`, 'error'); return; }
        const candidate = { ...form };
        const err = validateMaster(col, candidate, db[col]);
        if (err) { showToast(err, 'error'); return; }
        const saved = await saveItem(col, { ...candidate, id: form.id || undefined });
        if (saved) {
            showToast(col === 'warehouses' ? 'Đã lưu thông tin cửa hàng' : form.id ? `Đã cập nhật ${def.label.toLowerCase()} — mọi phiếu liên quan hiển thị tên mới!` : `Đã thêm ${def.label.toLowerCase()} mới!`);
            if (col === 'warehouses') setMasterForms(prev => { const n = { ...prev }; delete n.warehouses; return n; }); else setMasterForm(col, def.blank);
        }
    };
    const handleDeleteMaster = (col, item) => {
        const n = countRefs(db, col, item.id);
        if (n) { showToast(`"${item.name}" đang được dùng trong ${n} phiếu/thanh toán nên không thể xóa. Hãy đổi tên thay vì xóa.`, 'error'); return; }
        removeItem(col, item.id, `Xóa "${item.name}"?`);
    };
    const handleRelink = async u => {
        const toId = relinkChoice[u.key];
        if (!toId) { showToast('Chọn mục cần gán trước', 'error'); return; }
        setBusy(true);
        try {
            const res = await api('relink', { kind: u.kind, fromText: u.text, toId });
            showToast(`Đã gán ${res.count} phiếu "${u.text}"`);
            await loadAll();
        } catch (e) { handleError(e); }
        setBusy(false);
    };

    /* ---------- Tài khoản ---------- */
    /* ---------- Sao lưu / Khôi phục ---------- */
    const handleExportJSON = () => {
        const backup = { version: APP_VERSION, exportDate: new Date().toISOString(), exportedBy: user.username };
        COLLECTION_KEYS.forEach(k => { backup[k] = db[k] || []; });
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `Backup_KhoTrung_${todayStr()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        showToast('Đã sao lưu dữ liệu ra file JSON!');
    };

    const runBulkImport = async (data, sourceName) => {
        const parts = COLLECTION_KEYS.filter(k => Array.isArray(data[k]) && data[k].length).map(k => `${COLLECTION_LABEL[k]}: ${data[k].length}`);
        if (!parts.length) { showToast('Không tìm thấy dữ liệu để nhập', 'error'); return; }
        if (!(await askConfirm(`Nhập dữ liệu từ ${sourceName} vào ${isRemote ? 'Google Sheet' : 'bộ nhớ máy'}?\n\n${parts.join('\n')}\n\nBản ghi trùng mã (id) sẽ được ghi đè.`, 'Nhập dữ liệu'))) return;
        setBusy(true);
        try {
            const res = await api('bulkImport', { data });
            const s = Object.keys(res.summary || {}).map(k => `${COLLECTION_LABEL[k]} +${res.summary[k].added}/~${res.summary[k].updated}`).join(', ');
            showToast('Nhập dữ liệu xong: ' + s);
            await loadAll();
        } catch (e) { handleError(e); }
        setBusy(false);
    };

    const handleImportJSON = e => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try { runBulkImport(JSON.parse(ev.target.result), `file "${file.name}"`); }
            catch (err) { showToast('File JSON không hợp lệ hoặc bị lỗi!', 'error'); }
        };
        reader.readAsText(file, 'UTF-8');
    };

    const legacyData = () => {
        const data = {};
        COLLECTION_KEYS.forEach(k => { const v = lsJson(LEGACY_KEYS[k]); if (Array.isArray(v) && v.length) data[k] = v; });
        return data;
    };

    const handleExportCSV = () => {
        if (filteredLogRecords.length === 0) { showToast('Không có dữ liệu để xuất!', 'error'); return; }
        const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
        const headers = ['Mã Phiếu', 'Ngày', 'Kho', 'Loại', 'Mặt Hàng', 'Số Lượng (Quả)', 'Dây/Lẻ', 'Tồn Kho Sau Phiếu (Quả)', 'Đơn Giá (đ)', 'Thành Tiền (đ)', 'Tiền Thu/Nộp (đ)', 'Đối Tác', 'Nhân Viên', 'Người Nhập', 'Trạng Thái', 'Ghi Chú'];
        const rows = filteredLogRecords.map(r => [q(r.ticketNo), q(r.date), q(r.type === 'chuyenkho' ? `${whName(L, whOf(r))} -> ${whName(L, r.toWarehouseId)}` : (KHO_TYPES.includes(r.type) || r.warehouseId) ? whName(L, whOf(r)) : ''), q(r.typeLabel), q(r.itemType), r.quantity || 0, q(dayText(r.quantity || 0)), stockAfter[r.id] !== undefined ? stockAfter[r.id].bal : '', r.price || 0, r.totalPrice || 0, num(r.paidAmount), q(r.partner), q(r.staff), q(r.createdBy), q(STATUS_INFO[statusOf(r)].label), q(r.notes)].join(','));
        const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `Nhat_Ky_Kho_Trung_${todayStr()}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        showToast('Đã xuất file Excel (CSV)!');
    };

    /* ---------- Tính toán báo cáo ---------- */
    /* Báo cáo chỉ tính phiếu ĐÃ DUYỆT */
    const okRecords = records.filter(isApproved);
    const okPayments = payments.filter(isApproved);
    const okExpenses = expenses.filter(isApproved);
    const sumT = (arr, type) => arr.filter(r => r.type === type).reduce((a, r) => a + num(r.totalPrice), 0);

    const filteredRecordsForOverview = okRecords.filter(r => inRange(r.date, overviewStartDate, overviewEndDate));
    const filteredRecordsForDebt = okRecords.filter(r => inRange(r.date, debtStartDate, debtEndDate));
    const filteredPaymentsForDebt = okPayments.filter(p => inRange(p.date, debtStartDate, debtEndDate));
    // Lọc công nợ theo kho: hàng tính theo kho ghi trên phiếu; tiền thanh toán (không gắn kho) trừ vào khoản nợ cũ nhất trước
    const DW = debtWh && L.wh.byId[debtWh] ? String(debtWh) : null;
    const debtSplit = DW ? paymentWhSplit(filteredRecordsForDebt, filteredPaymentsForDebt, L) : null;
    const payPart = p => DW ? (splitOf(debtSplit, p)[DW] || 0) : num(p.amount);
    const inDW = r => DW == null || whOf(r) === DW;
    // Công nợ: gom 1 lượt qua phiếu & thanh toán (nhanh với dữ liệu lớn), thay cho lọc lại toàn bộ cho từng đối tác
    const debtAgg = (() => {
        const sup = {}, cus = {}, get = (m, k) => m[k] || (m[k] = { t: 0, p: 0 });
        for (const r of filteredRecordsForDebt) {
            if (!inDW(r)) continue;
            const pid = idOf(recPartner(L, r)); if (!pid) continue;
            if (r.type === 'nhap') get(sup, pid).t += num(r.totalPrice);
            else if (partnerKind(r) === 'customer') { const o = get(cus, pid); o.t += num(r.totalPrice); if (r.type === 'giaokhach') o.p += num(r.paidAmount); }
        }
        for (const p of filteredPaymentsForDebt) {
            const m = p.type === 'supplier' ? sup : p.type === 'customer' ? cus : null; if (!m) continue;
            const pid = idOf(payPartner(L, p)); if (pid) get(m, pid).p += payPart(p);
        }
        return { sup, cus };
    })();
    const debtRow = (x, m) => { const a = m[String(x.id)] || { t: 0, p: 0 }; return { ...x, totalAmount: a.t, paidAmount: a.p, remaining: a.t - a.p }; };
    const supplierDebts = suppliers.map(s => debtRow(s, debtAgg.sup)).filter(x => !DW || x.totalAmount || x.paidAmount);
    const customerDebts = customers.map(c => debtRow(c, debtAgg.cus)).filter(x => !DW || x.totalAmount || x.paidAmount);

    const filteredExpenses = expenses.filter(ex => inRange(ex.date, expStartDate, expEndDate) && (!SW || String(ex.warehouseId || '') === SW));
    const totalChiPhi = filteredExpenses.filter(isApproved).reduce((a, ex) => a + ex.amount, 0);

    // Lọc theo kho: doanh thu / vốn nhập theo kho ghi trên phiếu; chi phí chỉ tính khoản ghi cho kho đó (khoản "chung" để riêng)
    const RW = revWh && L.wh.byId[revWh] ? String(revWh) : null;
    const recRev = okRecords.filter(r => inRange(r.date, revStartDate, revEndDate) && (RW == null || whOf(r) === RW));
    const doanhThuXuat = sumT(recRev, 'xuat') + sumT(recRev, 'giaokhach');
    const chiPhiNhap = sumT(recRev, 'nhap');
    const expRev = okExpenses.filter(ex => inRange(ex.date, revStartDate, revEndDate));
    const chiPhiKhac = expRev.filter(ex => RW == null || String(ex.warehouseId || '') === RW).reduce((a, ex) => a + ex.amount, 0);
    const chiPhiChung = RW == null ? 0 : expRev.filter(ex => !ex.warehouseId).reduce((a, ex) => a + ex.amount, 0);
    // Thu khác (ghi ở Sổ quỹ) cộng vào lợi nhuận
    const laiTienGui = RW != null ? 0 : cashflows.filter(cf => inRange(cf.date, revStartDate, revEndDate) && cf.flowType === 'in').reduce((a, cf) => a + num(cf.amount), 0);
    const loiNhuan = (doanhThuXuat + laiTienGui) - (chiPhiNhap + chiPhiKhac);

    // Sổ quỹ: tiền NV thu chỉ vào quỹ công ty khi NV nộp về
    const totalThuKhach = okPayments.filter(p => p.type === 'customer' && !p.staffId).reduce((a, p) => a + p.amount, 0);
    const totalNvNop = okRecords.filter(r => r.type === 'nopve').reduce((a, r) => a + num(r.paidAmount), 0);
    const totalCashIn = cashflows.filter(cf => cf.flowType === 'in').reduce((a, cf) => a + cf.amount, 0);
    // Khách chuyển khoản thẳng cho công ty khi NV giao / NV thu nợ (NV không cầm tiền này)
    const totalCkTrucTiep = okRecords.filter(r => r.type === 'giaokhach').reduce((a, r) => a + bankPart(r, r.paidAmount), 0)
        + okPayments.filter(p => p.type === 'customer' && p.staffId).reduce((a, p) => a + bankPart(p, p.amount), 0);
    const totalTongThuQuy = totalThuKhach + totalNvNop + totalCashIn + totalCkTrucTiep;
    // Tách số dư quỹ: tiền mặt / ngân hàng
    const sumBank = (list, amt) => list.reduce((a, x) => a + bankPart(x, amt(x)), 0);
    const thuNH = sumBank(okPayments.filter(p => p.type === 'customer' && !p.staffId), p => p.amount) + sumBank(okRecords.filter(r => r.type === 'nopve'), r => r.paidAmount)
        + sumBank(cashflows.filter(cf => cf.flowType === 'in'), cf => cf.amount) + totalCkTrucTiep;
    const chiNH = sumBank(okPayments.filter(p => p.type === 'supplier'), p => p.amount) + sumBank(okExpenses, ex => ex.amount) + sumBank(cashflows.filter(cf => cf.flowType === 'out'), cf => cf.amount);
    const totalTraNCC = okPayments.filter(p => p.type === 'supplier').reduce((a, p) => a + p.amount, 0);
    const totalChiPhiQuy = okExpenses.reduce((a, ex) => a + ex.amount, 0);
    const totalCashOut = cashflows.filter(cf => cf.flowType === 'out').reduce((a, cf) => a + cf.amount, 0);
    const totalTongChiQuy = totalTraNCC + totalChiPhiQuy + totalCashOut;
    const soDuQuyTienMat = totalTongThuQuy - totalTongChiQuy;
    const soDuNganHang = thuNH - chiNH, soDuTienMatRieng = soDuQuyTienMat - soDuNganHang;

    // Bản hiển thị của phiếu: luôn lấy tên mới nhất từ danh mục theo mã
    const filteredLogRecords = records.map(r => {
        const p = recPartner(L, r);
        return { ...r, itemType: catNameOf(r), partner: p ? p.name : r.partner, staff: staffNameOf(r), _pkey: p ? (partnerKind(r) === 'supplier' ? 's:' : 'c:') + p.id : '' };
    }).filter(r => {
        if (!inRange(r.date, logFilterStartDate, logFilterEndDate)) return false;
        if (logFilterType === 'pending' ? statusOf(r) !== 'pending' : (logFilterType !== 'all' && r.type !== logFilterType)) return false;
        if (logFilterPartner !== 'all' && r._pkey !== logFilterPartner) return false;
        if (logFilterWh !== 'all' && !((KHO_TYPES.includes(r.type) || r.warehouseId) && whOf(r) === logFilterWh) && String(r.toWarehouseId || '') !== logFilterWh) return false;
        if (logSearchQuery) {
            const q = logSearchQuery.toLowerCase().trim();
            if (![r.ticketNo, r.itemType, r.partner, r.notes, r.staff, r.createdBy].some(v => String(v || '').toLowerCase().includes(q))) return false;
        }
        return true;
    });
    const partnerOptions = [
        ...suppliers.map(s => ({ key: 's:' + s.id, label: `${s.name} (NCC)` })),
        ...customers.map(c => ({ key: 'c:' + c.id, label: `${c.name} (Khách)` }))
    ];

    /* =================================================================
       RENDER TỪNG TAB
       ================================================================= */
    const pendingBanner = () => false ? h('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-sm' },
        h('span', null, h('i', { className: 'fas fa-hourglass-half mr-2' }), `Có ${pendingItems.length} phiếu đang chờ duyệt — chưa được tính vào báo cáo.`),
        h('button', { onClick: () => openTab('duyet'), className: 'px-3 py-1.5 bg-amber-600 text-white rounded-lg font-bold text-xs whitespace-nowrap' }, 'Đi duyệt')) : null;

    /* ---------- KHO HÀNG: xem theo ngày / khoảng ngày ----------
       Tồn đầu kỳ = mọi phiếu ĐÃ DUYỆT trước ngày bắt đầu; Tồn cuối kỳ = tồn đầu + nhập + NV trả về − xuất bán − NV mang đi giao (phiếu giao cho khách). */
    const fmtDay = d => d ? d.split('-').reverse().join('/') : '';
    const shiftDay = (d, n) => { const t = new Date((d || todayStr()) + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
    const renderKho = () => {
        const S = overviewStartDate, E = overviewEndDate;
        const isDay = !!S && S === E;
        const ofCat = (r, cid) => idOf(recCat(L, r)) === cid;
        const before = S ? okRecords.filter(r => String(r.date) < S) : [];
        const upToEnd = E ? okRecords.filter(r => String(r.date) <= E) : okRecords;
        const W = khoWh && L.wh.byId[khoWh] ? String(khoWh) : null;   // null = tất cả kho
        const inWh = r => W == null || whOf(r) === W;
        const rows = categories.map(cat => {
            const cid = String(cat.id);
            const q = type => filteredRecordsForOverview.filter(r => r.type === type && ofCat(r, cid) && inWh(r)).reduce((a, r) => a + num(r.quantity), 0);
            const tr = filteredRecordsForOverview.filter(r => r.type === 'chuyenkho' && ofCat(r, cid));
            const ckIn = W == null ? 0 : tr.filter(r => String(r.toWarehouseId) === W).reduce((a, r) => a + num(r.quantity), 0);
            const ckOut = W == null ? 0 : tr.filter(r => whOf(r) === W).reduce((a, r) => a + num(r.quantity), 0);
            const open = before.filter(r => ofCat(r, cid)).reduce((a, r) => a + deltaFor(r, 'kho', W), 0);
            const gk = filteredRecordsForOverview.filter(r => isDirect(r) && ofCat(r, cid) && inWh(r)).reduce((a, r) => a + num(r.quantity), 0); // NV giao thẳng từ kho
            const nhap = q('nhap'), xuat = q('xuat') + gk, xnv = q('xuatnv'), tra = q('nopve');
            const close = open + nhap + tra + ckIn - xuat - xnv - ckOut;
            const nvGiu = staffs.reduce((a, st) => a + stockStaff(upToEnd, L, st.id, cid, null, false, W), 0);
            // tồn cuối theo từng kho (bảng so sánh khi xem "Tất cả")
            const byWh = warehouses.map(w => upToEnd.filter(r => ofCat(r, cid)).reduce((a, r) => a + deltaFor(r, 'kho', String(w.id)), 0));
            return { cat, open, nhap, xuat, gk, xnv, tra, ckIn, ckOut, close, nvGiu, byWh };
        });
        const tot = k => rows.reduce((a, x) => a + x[k], 0);
        // loại hàng có phát sinh / còn tồn mới hiện trong bảng
        const hasQty = x => !!(x.open || x.nhap || x.xuat || x.tra || x.ckIn || x.ckOut || x.close);
        const qCell = (v, cls, bold) => h('td', { className: `p-3 text-right whitespace-nowrap ${cls}` },
            h('div', { className: bold ? 'font-black' : 'font-semibold' }, `${fmt(v)} quả`),
            h('div', { className: 'text-xs font-semibold text-slate-400' }, dayText(v)));
        const periodLabel = isDay ? `ngày ${fmtDay(S)}` : (S || E) ? `${S ? fmtDay(S) : 'đầu'} → ${E ? fmtDay(E) : 'nay'}` : 'tất cả thời gian';
        const money = types => filteredRecordsForOverview.filter(r => types.includes(r.type) && inWh(r)).reduce((a, r) => a + num(r.totalPrice), 0);
        const khoLabel = W == null ? 'toàn kho' : whName(L, W);
        const dayRecs = (S || E) ? records.filter(r => inRange(r.date, S, E) && statusOf(r) !== 'rejected' && (inWh(r) || (r.type === 'chuyenkho' && String(r.toWarehouseId) === W)))
            .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.createdAt || '').localeCompare(String(b.createdAt || ''))) : [];
        const btn = (label, onClick, on) => h('button', { onClick, className: `px-3 py-2 rounded-xl text-sm font-bold ${on ? 'bg-amber-500 text-slate-900' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}` }, label);
        const today = todayStr(), yest = shiftDay(today, -1);

        // Hộp thoại chi tiết khi bấm vào ô báo cáo
        const recList = list => table([['Ngày'], ['Mã'], ['Loại'], ['Mặt hàng'], ['Số lượng', 'text-right'], ['Thành tiền', 'text-right'], ['Đối tác']],
            [...list].sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt || '').localeCompare(String(a.createdAt || ''))).map(r => { const T = REC_TYPES[r.type] || {};
                return h('tr', { key: r.id, className: 'text-sm' },
                    h('td', { className: 'p-2.5 font-mono text-xs whitespace-nowrap' }, r.date),
                    h('td', { className: 'p-2.5 font-mono text-xs whitespace-nowrap' }, r.ticketNo || ''),
                    h('td', { className: 'p-2.5' }, h('span', { className: `px-2 py-0.5 rounded-md text-xs font-bold whitespace-nowrap ${T.badge || ''}` }, isDirect(r) ? 'NV giao khách (từ kho)' : T.label)),
                    h('td', { className: 'p-2.5' }, catNameOf(r)),

    const blankLine = () => ({ key: newId(), categoryId: '', mode: 'day', qty: '', price: '' });

    // Số tiền khách cần chuyển cho đơn (để điền sẵn vào mã QR)

    const customerDebtSlips = cid => {
        const R = records.filter(r => isApproved(r) && partnerKind(r) === 'customer' && idOf(recPartner(L, r)) === String(cid));

            let rest = p.amt;
            const take = list => { for (const x of list) { if (rest <= 0) break; const t = Math.min(rest, x.left); x.left -= t; rest -= t; } };
            if (p.wh) take(slips.filter(x => x.wh === p.wh));

    const handleQrFile = async (file, form) => {
        if (!file) return;
        if (!/^image\//.test(file.type)) { showToast('Vui lòng chọn file ảnh', 'error'); return; }
        try {
            const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
            const im = await new Promise((res, rej) => { const x = new Image(); x.onload = () => res(x); x.onerror = rej; x.src = url; });
            let out = '';
            for (const [max, qual] of [[600, 0.85], [520, 0.8], [440, 0.75], [380, 0.7], [320, 0.65], [280, 0.6]]) {
                const k = Math.min(1, max / Math.max(im.width, im.height));
                const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
                const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
                out = cv.toDataURL('image/jpeg', qual);
                if (out.length < 45000) break;
            }
            if (out.length >= 45000) { showToast('Ảnh quá lớn. Hãy cắt ảnh chỉ còn phần mã QR rồi tải lại.', 'error'); return; }
            setMasterForm('warehouses', { ...form, qrImage: out });
            showToast('Đã chọn ảnh QR — bấm "Lưu thông tin cửa hàng" để lưu');
        } catch (e) { showToast('Không đọc được ảnh này', 'error'); }
    };

                        h('button', { type: 'button', onClick: () => setPayModal(blankPay), className: 'flex-1 py-3 bg-slate-100 font-bold rounded-xl text-slate-600' }, 'Hủy'),
                        h('button', { type: 'submit', disabled: busy, className: 'flex-1 py-3 bg-emerald-600 font-bold text-white rounded-xl shadow hover:bg-emerald-700 disabled:opacity-60' }, 'Lưu Thanh Toán'))))) : null,


    ));
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
