<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
<div id="root"></div>
<script>
const { useState, useEffect, useMemo, useRef } = React;
// Icon Font Awesome (dạng SVG) không tự đổi hình khi đổi class => gắn key theo class để React vẽ lại icon mới
const h = (type, props, ...ch) => (type === 'i' && props && props.className && props.key == null)
    ? React.createElement(type, { ...props, key: props.className }, ...ch) : React.createElement(type, props, ...ch);

/* =====================================================================
   1. CẤU HÌNH
   ===================================================================== */
// Dán URL Web App của Google Apps Script vào đây để MỌI MÁY dùng chung 1 Google Sheet.
// Để trống => app chạy CHẾ ĐỘ THỬ NGHIỆM (lưu trên trình duyệt), có thể nhập URL ở màn hình đăng nhập.
const DEFAULT_API_URL = '';
// Logo Fresh Eggs (ảnh khai báo ở <head>, bản 512px cho nét)
const APP_LOGO = (() => { try { return window.APP_LOGO_SRC || ''; } catch (e) { return ''; } })();
function LogoMark({ size = 40 }) {
    return APP_LOGO ? h('img', { src: APP_LOGO, alt: 'Fresh Eggs', style: { height: size, width: 'auto', display: 'block' } })
        : h('span', { style: { fontSize: size * 0.6 } }, '🥚');
}
// BẢN DÙNG THỬ: true = chạy trên trình duyệt với dữ liệu mẫu, không kết nối Google Sheet, không tải file.
const DEMO_MODE = false;
const TEST_BUILD = false;
const EGGS_PER_DAY = 300;
const APP_VERSION = '3.0 đơn giản';

const DEFAULT_CATEGORIES = [
    { id: '1', code: 'DTH', name: 'Đỏ TH', unit: 'Quả' },
    { id: '2', code: 'TLT', name: 'Trắng LT', unit: 'Quả' },
    { id: '3', code: 'D20', name: 'Đỏ 20kg', unit: 'Quả' },
    { id: '4', code: 'D19', name: 'Đỏ 19kg', unit: 'Quả' },
    { id: '5', code: 'D18', name: 'Đỏ 18kg', unit: 'Quả' },
    { id: '6', code: 'D17', name: 'Đỏ 17kg', unit: 'Quả' },
    { id: '7', code: 'D16', name: 'Đỏ 16kg', unit: 'Quả' },
    { id: '8', code: 'TQN', name: 'Trắng QN', unit: 'Quả' },
    { id: '9', code: 'TTH', name: 'Trắng TH', unit: 'Quả' },
    { id: '10', code: 'TO', name: 'Trứng trắng to', unit: 'Quả' },
    { id: '11', code: 'NHO', name: 'Trứng trắng nhỏ', unit: 'Quả' }
];
// Danh mục kho. Dữ liệu cũ (chưa ghi kho) được tính vào kho mã '1'.
const DEFAULT_WAREHOUSES = [
    { id: '1', code: 'K1', name: 'Cửa hàng của tôi', phone: '', address: '' }
];
const DEFAULT_WH = '1';
const DEFAULT_SUPPLIERS = [
    { id: '1', name: 'Trại gà Ba Huân', phone: '0903123456', address: 'Bình Chánh, TP.HCM' },
    { id: '2', name: 'Trại trứng Cường Phát', phone: '0918234567', address: 'Đồng Nai' }
];
const DEFAULT_CUSTOMERS = [
    { id: '1', name: 'Đại lý Minh Hải', phone: '0987654321', address: 'Chợ Đầu Mối Bình Điền' },
    { id: '2', name: 'Tạp hóa Cô Lan', phone: '0933112233', address: 'Quận 8, TP.HCM' }
];
const DEFAULT_STAFFS = [];


/* ---------- PHÂN QUYỀN (khớp với Code.gs) ---------- */
const ROLE_INFO = {
    admin:    { label: 'Quản trị viên', badge: 'bg-amber-400 text-slate-900', icon: 'fa-crown', desc: 'Toàn quyền: mọi dữ liệu, xóa, tài khoản, cấu hình' },
    nhaplieu: { label: 'Nhập liệu',     badge: 'bg-emerald-500 text-white',   icon: 'fa-keyboard', desc: 'Tạo phiếu nhập/xuất, chi phí, thu/trả công nợ; chỉ sửa dữ liệu mình nhập' },
    user:     { label: 'Người xem',     badge: 'bg-sky-500 text-white',       icon: 'fa-eye', desc: 'Chỉ xem báo cáo, không chỉnh sửa' },
    giaohang: { label: 'NV giao hàng',  badge: 'bg-violet-500 text-white',    icon: 'fa-truck', desc: 'Ghi phiếu giao khách, thu tiền, nộp về của chính mình; xem công nợ của mình' }
};
const OFFICE_ROLES = ['admin', 'nhaplieu', 'user'];
const WRITE_PERMS = {
    admin: ['users', 'warehouses', 'categories', 'suppliers', 'customers', 'staffs', 'records', 'payments', 'expenses', 'cashflows'],
    nhaplieu: ['records', 'payments', 'expenses', 'customers', 'suppliers'],
    user: [],
    giaohang: ['records', 'payments']
};

/* ---------- LOẠI PHIẾU KHO ----------
   nhap: NCC -> kho · xuat: kho -> khách (bán trực tiếp)
   xuatnv: kho -> nhân viên đi giao · giaokhach: nhân viên -> khách (có thể thu tiền ngay)
   nopve: nhân viên -> kho (trả trứng còn dư và/hoặc nộp tiền đã thu) */
const REC_TYPES = {
    nhap:      { label: 'Nhập kho',      prefix: 'PN-', badge: 'bg-emerald-100 text-emerald-800' },
    xuat:      { label: 'Xuất bán',      prefix: 'PX-', badge: 'bg-blue-100 text-blue-800' },
    xuatnv:    { label: 'Phiếu giao hàng', prefix: 'XN-', badge: 'bg-violet-100 text-violet-800' },
    giaokhach: { label: 'NV giao khách', prefix: 'GK-', badge: 'bg-sky-100 text-sky-800' },
    nopve:     { label: 'NV nộp về',     prefix: 'NV-', badge: 'bg-amber-100 text-amber-800' },
    chuyenkho: { label: 'Chuyển kho',    prefix: 'CK-', badge: 'bg-cyan-100 text-cyan-800' }
};
const STAFF_TYPES = ['xuatnv', 'giaokhach', 'nopve'];
const GH_KINDS = {
    // Công ty: "Giao cho khách" = tạo phiếu giao hàng (bản ghi xuatnv) — hàng xuất kho ngay, NV cầm đi giao
    xuatnv:    { label: 'Giao cho khách', icon: 'fa-truck-fast', roles: ['admin', 'nhaplieu'] },
    // NV: xác nhận đã giao (từ hàng của phiếu giao đang cầm) — giao ít hơn / giao khách khác
    giaokhach: { label: 'Giao cho khách', icon: 'fa-truck-fast', roles: ['giaohang'] },
    thuno:     { label: 'Thu nợ khách', icon: 'fa-hand-holding-dollar', roles: [] }, // chỉ công ty thu nợ (ở Báo Cáo Công Nợ); giữ lại để sửa phiếu cũ
    nopve:     { label: 'Nộp tiền / trả hàng', icon: 'fa-building-circle-arrow-right', roles: ['admin', 'nhaplieu', 'giaohang'] }
};

/* ---------- DUYỆT PHIẾU ----------
   Phiếu (kho, thanh toán, chi phí) do người khác admin tạo/sửa => "Chờ duyệt", chưa tính vào báo cáo.
   Admin tạo => tự duyệt. Dữ liệu cũ không có trạng thái => coi như đã duyệt. */
const STATUS_COLS = ['records', 'payments', 'expenses'];
const STATUS_INFO = {
    pending:  { label: 'Chờ duyệt', badge: 'bg-amber-100 text-amber-800', icon: 'fa-hourglass-half' },
    approved: { label: 'Đã duyệt',  badge: 'bg-emerald-100 text-emerald-800', icon: 'fa-check' },
    rejected: { label: 'Từ chối',   badge: 'bg-rose-100 text-rose-800', icon: 'fa-xmark' }
};
const statusOf = x => (x && x.status) || 'approved';
const isApproved = x => statusOf(x) === 'approved';
const isLive = x => statusOf(x) !== 'rejected';
const COLLECTION_KEYS = ['warehouses', 'categories', 'suppliers', 'customers', 'staffs', 'records', 'payments', 'expenses', 'cashflows'];
const LEGACY_KEYS = { categories: 'bh_categories', suppliers: 'bh_suppliers', customers: 'bh_customers', staffs: 'bh_staffs', records: 'bh_records', payments: 'bh_payments', expenses: 'bh_expenses', cashflows: 'bh_cashflows' };
const COLLECTION_LABEL = { warehouses: 'Kho', categories: 'Loại trứng', suppliers: 'Nhà cung cấp', customers: 'Khách hàng', staffs: 'Nhân viên', records: 'Phiếu kho', payments: 'Thanh toán', expenses: 'Chi phí', cashflows: 'Dòng tiền' };

const TABS = [
    { id: 'khohang',  label: 'Kho Hàng',              icon: 'fa-warehouse',      color: 'bg-amber-500 text-slate-950', roles: OFFICE_ROLES },
    { id: 'nhap',     label: 'Nhập Hàng',             icon: 'fa-file-import',    color: 'bg-emerald-600 text-white',   roles: ['admin', 'nhaplieu'] },
    { id: 'xuat',     label: 'Đơn Hàng',              icon: 'fa-receipt',    color: 'bg-blue-600 text-white',      roles: ['admin', 'nhaplieu'] },

function parseVNNumber(str) {

}

}

function convText(mode, raw) {
    const v = parseVNNumber(raw);
    if (!v) return '';

    const d = v / EGGS_PER_DAY;
    return `= ${dayText(v)}${v % EGGS_PER_DAY ? ` (≈ ${d.toLocaleString('vi-VN', { maximumFractionDigits: 2 })} dây)` : ''}`;
}
function dayText(q) {

function linkRecord(o, L) {
    const sig = () => [o.categoryId, o.itemType, o.partnerId, o.partner, o.staffId, o.staff].join('|');

    const c = recCat(L, o); if (c) { o.categoryId = String(c.id); o.itemType = catLabelOf(c); }

function countRefs(db, col, id) {

        if (col === 'categories') m = recCat(L, r);
        else if (col === 'staffs') m = recStaff(L, r);
        else if ((col === 'suppliers' && partnerKind(r) === 'supplier') || (col === 'customers' && partnerKind(r) === 'customer')) m = recPartner(L, r);
        if (idOf(m) === sid) n++;
    });
    if (col === 'suppliers' || col === 'customers') (db.payments || []).forEach(p => {
        if ((col === 'suppliers') === (p.type === 'supplier') && idOf(payPartner(L, p)) === sid) n++;
    });
    if (col === 'staffs') (db.payments || []).forEach(p => { if (String(p.staffId || '') === sid || String(p.debtStaffId || '') === sid) n++; });
    if (col === 'staffs') (db.users || []).forEach(u => { if (String(u.staffId || '') === sid) n++; });
    if (col === 'warehouses') {

/* ---------- SỔ CÁI: tồn kho, hàng & tiền nhân viên đang giữ ----------
   live=false: chỉ phiếu đã duyệt (báo cáo, lúc duyệt).
   live=true : cả phiếu chờ duyệt (lúc nhập phiếu mới, để không xuất quá số đang có). */
const countIn = (r, live) => live ? isLive(r) : isApproved(r);
// Tồn kho của 1 loại trứng; wh = mã kho (bỏ trống = cộng mọi kho)
function stockKho(records, L, catId, excludeId, live, wh) {
    return (records || []).reduce((a, r) => {
        if (String(r.id) === String(excludeId) || !countIn(r, live) || idOf(recCat(L, r)) !== String(catId)) return a;
        return a + deltaFor(r, 'kho', wh == null || wh === '' ? null : wh);
    }, 0);
}
// Hàng NV đang giữ; wh = chỉ tính hàng của kho đó (nhận từ kho nào thì giao/trả tính cho kho đó)
function stockStaff(records, L, staffId, catId, excludeId, live, wh) {
    return (records || []).reduce((a, r) => {
        if (String(r.id) === String(excludeId) || !countIn(r, live) || idOf(recStaff(L, r)) !== String(staffId)) return a;
        if (catId != null && idOf(recCat(L, r)) !== String(catId)) return a;
        if (wh != null && wh !== '' && whOf(r) !== String(wh)) return a;
        if (isDirect(r)) return a; // giao thẳng từ kho: NV không giữ hàng
        if (r.type === 'xuatnv') return a + num(r.quantity);
        if (r.type === 'giaokhach' || r.type === 'nopve') return a - num(r.quantity);
        return a;
    }, 0);
}
// Tiền nhân viên đang giữ = thu khi giao + thu nợ khách - đã nộp về
/* ---------- PHƯƠNG THỨC THANH TOÁN ----------
   bankAmount = phần CHUYỂN KHOẢN (vào thẳng tài khoản công ty); phần còn lại là TIỀN MẶT.
   NV giao hàng chỉ giữ phần tiền mặt; phần khách chuyển khoản NV không phải nộp lại. */
const bankPart = (x, total) => Math.max(0, Math.min(num(x && x.bankAmount), num(total)));
const cashPart = (x, total) => num(total) - bankPart(x, total);
const pmFrom = (x, total) => { const b = bankPart(x, total); return { pmMode: b <= 0 ? 'cash' : b >= num(total) ? 'bank' : 'mix', pmBank: b > 0 && b < num(total) ? String(b) : '' }; };
const pmBankOf = (f, total) => f.pmMode === 'bank' ? num(total) : f.pmMode === 'mix' ? Math.max(0, Math.min(parseVNNumber(f.pmBank), num(total))) : 0;
const pmTag = (total, bankAmt) => {
    const t = num(total), b = Math.max(0, Math.min(num(bankAmt), t));
    if (!t) return null;
    const cls = 'inline-block px-1.5 py-0.5 rounded text-[11px] font-bold whitespace-nowrap';
    return b <= 0 ? h('span', { className: cls + ' bg-emerald-50 text-emerald-700' }, h('i', { className: 'fas fa-money-bill-wave mr-1' }), 'Tiền mặt')
        : b >= t ? h('span', { className: cls + ' bg-sky-50 text-sky-700' }, h('i', { className: 'fas fa-building-columns mr-1' }), 'Chuyển khoản')
        : h('span', { className: cls + ' bg-indigo-50 text-indigo-700' }, `TM ${fmt(t - b)} · CK ${fmt(b)}`);
};
function cashStaff(records, payments, L, staffId, excludeId, live) {
    let c = 0; const sid = String(staffId);
    (records || []).forEach(r => {
        if (String(r.id) === String(excludeId) || !countIn(r, live) || idOf(recStaff(L, r)) !== sid) return;
        if (r.type === 'giaokhach') c += cashPart(r, r.paidAmount); // khách chuyển khoản => NV không giữ
        if (r.type === 'nopve') c -= num(r.paidAmount);
    });
    (payments || []).forEach(p => {
        if (String(p.id) === String(excludeId) || !countIn(p, live) || String(p.staffId || '') !== sid) return;
        if (p.type === 'customer') c += cashPart(p, p.amount);
    });
    return c;
}
/* ---------- NỢ KHÁCH DO NHÂN VIÊN CHO NỢ ----------
   NV giao hàng mà khách chưa trả đủ => khoản nợ đó "thuộc" NV đã cho nợ.
   Phiếu thu tiền khách có 2 trường:
     staffId     = NV đang CẦM tiền (trống = tiền vào thẳng quỹ công ty, ví dụ admin tự thu)
     debtStaffId = trừ vào nợ do NV nào cho nợ ('none' = không trừ cho NV nào; trống = mặc định theo staffId) */
const debtStaffOf = p => p.debtStaffId === 'none' ? '' : String(p.debtStaffId || p.staffId || '');
// Khách còn nợ bao nhiêu trong khoản do NV sid cho nợ (tính cả phiếu chờ duyệt)
function staffCustDebt(records, payments, L, sid, cid) {
    let left = 0;
    (records || []).forEach(r => {
        if (r.type === 'giaokhach' && isLive(r) && idOf(recStaff(L, r)) === String(sid) && idOf(recPartner(L, r)) === String(cid)) left += num(r.totalPrice) - num(r.paidAmount);
    });
    (payments || []).forEach(p => {
        if (p.type === 'customer' && isLive(p) && debtStaffOf(p) === String(sid) && idOf(payPartner(L, p)) === String(cid)) left -= num(p.amount);
    });
    return left;
}
// Thu nợ không được nhiều hơn số khách đang nợ do NV đó cho nợ
function paymentDebtError(records, payments, L, pay) {
    if (pay.type !== 'customer') return null;
    const sid = debtStaffOf(pay); if (!sid) return null;
    const cid = idOf(payPartner(L, pay)); if (!cid) return null;
    const owed = staffCustDebt(records, (payments || []).filter(p => String(p.id) !== String(pay.id)), L, sid, cid);
    if (num(pay.amount) > owed) {
        const st = (L.staff.byId[sid] || {}).name || 'NV', c = (L.cus.byId[cid] || {}).name || 'khách';
        return `Số tiền thu ${fmt(pay.amount)} đ lớn hơn số ${c} đang nợ do ${st} cho nợ (${fmt(Math.max(0, owed))} đ).`;
    }
    return null;
}
// Tiền NV đang giữ không được âm: không nộp quá số đang giữ; không xóa/sửa phiếu thu mà tiền đã nộp về.
// recsBefore/paysBefore -> recsAfter/paysAfter: dữ liệu trước & sau thay đổi
function cashGuardError(L, recsBefore, paysBefore, recsAfter, paysAfter, sids, verb) {
    for (const sid of sids) {
        if (!sid) continue;
        const before = cashStaff(recsBefore, paysBefore, L, sid, null, true), after = cashStaff(recsAfter, paysAfter, L, sid, null, true);
        if (after < 0 && after < before) {
            const st = (L.staff.byId[sid] || {}).name || 'NV';
            return verb === 'nộp'
                ? `Không thể nộp: ${st} chỉ đang giữ ${fmt(Math.max(0, before))} đ (tính cả phiếu chờ duyệt).`
                : `Không thể ${verb}: ${st} đã nộp số tiền này về công ty, ${verb} sẽ làm tiền NV bị âm ${fmt(-after)} đ — hãy xóa (hoặc giảm) phiếu nộp về trước.`;
        }
    }

   3. LỚP DỮ LIỆU: Google Sheet (online) hoặc trình duyệt (thử nghiệm)
   ===================================================================== */
async function remoteCall(url, action, payload, token) {
    let res;
    try {
        // text/plain để tránh lỗi CORS preflight của Apps Script
        res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...(payload || {}), action, token }), redirect: 'follow' });
    } catch (e) {
        throw apiError('Không kết nối được Google Sheet. Kiểm tra mạng hoặc URL Web App.', 'NET');
    }
    let json;
    try { json = await res.json(); } catch (e) {
        throw apiError('Máy chủ trả về dữ liệu không hợp lệ. Kiểm tra Web App đã triển khai với quyền "Bất kỳ ai".', 'NET');
    }
    if (!json.ok) throw apiError(json.error || 'Lỗi máy chủ', json.code);
    return json;
}

async function localApi(action, p, token) {
    p = p || {};
    const db = loadLocalDb();
    const save = () => lsSet(LOCAL_DB_KEY, JSON.stringify(db));
    const pub = u => ({ id: u.id, username: u.username, fullName: u.fullName, role: u.role, active: u.active, staffId: u.staffId || '' });

    if (action === 'ping') return { version: 'local' };
    if (action === 'login') {
        const u = db.users.find(x => x.username === String(p.username || '').trim().toLowerCase());
        if (!u || u.password !== p.password) throw apiError('Sai tên đăng nhập hoặc mật khẩu');
        if (!u.active) throw apiError('Tài khoản đã bị khóa. Liên hệ quản trị viên.');
        return { token: 'local-' + u.id, user: pub(u) };
    }
    const me = db.users.find(x => 'local-' + x.id === token);
    if (!me || !me.active) throw apiError('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại', 'AUTH');
    const user = pub(me);
    const now = new Date().toISOString();
    const setStatus = (rec, decision, reason) => {
        rec.status = decision; rec.approvedBy = decision === 'pending' ? '' : user.username;
        rec.approvedAt = decision === 'pending' ? '' : now; rec.rejectReason = decision === 'rejected' ? (reason || '') : '';
    };

    switch (action) {
        case 'logout': return {};
        case 'getAll': {
            if (migrateLinksInPlace(db)) save();
            const data = {};
            COLLECTION_KEYS.forEach(k => { data[k] = db[k] || []; });
            if (user.role === 'admin') data.users = db.users.map(pub);
            if (user.role === 'giaohang') {
                // NV giao hàng chỉ thấy dữ liệu của chính mình
                const sid = String(user.staffId || '');
                data.records = data.records.filter(r => sid && String(r.staffId) === sid);
                data.payments = data.payments.filter(x => sid && (String(x.staffId) === sid || debtStaffOf(x) === sid));
                data.expenses = []; data.cashflows = []; data.suppliers = [];
                data.staffs = data.staffs.filter(x => String(x.id) === sid);
            }
            return { data, user };
        }
        case 'save': {
            const col = p.collection;
            const item = { ...(p.item || {}) };
            ['status', 'approvedBy', 'approvedAt', 'rejectReason', 'createdBy', 'createdAt'].forEach(k => delete item[k]);
            if (!canWrite(user, col)) throw apiError('Bạn không có quyền ghi dữ liệu này', 'PERM');
            if (user.role === 'giaohang') {
                if (!user.staffId) throw apiError('Tài khoản chưa được gắn với nhân viên. Liên hệ quản trị viên.', 'PERM');
                if (col === 'records' && !['giaokhach', 'nopve'].includes(item.type)) throw apiError('Bạn chỉ được ghi phiếu giao khách / nộp về', 'PERM');
                if (col === 'payments' && item.type !== 'customer') throw apiError('Bạn chỉ được ghi phiếu thu tiền khách', 'PERM');
                item.staffId = String(user.staffId);
                if (col === 'payments') item.debtStaffId = String(user.staffId);
            }
            const list = db[col] || (db[col] = []);
            const idx = item.id ? list.findIndex(x => String(x.id) === String(item.id)) : -1;
            const existing = idx >= 0 ? list[idx] : null;
            if (existing && !canEdit(user, col, existing)) throw apiError(isApproved(existing) && user.role !== 'admin' ? 'Phiếu đã được duyệt, chỉ quản trị viên được sửa' : 'Bạn chỉ được sửa dữ liệu do chính mình tạo', 'PERM');
            const rec = { ...(existing || {}), ...item };
            if (!existing) { rec.id = item.id || newId(); rec.createdBy = user.username; rec.createdAt = now; }
            rec.updatedBy = user.username; rec.updatedAt = now;
            const L = buildLinks(db);
            if (col === 'records') {
                const err = prepareRecordLocal(rec, list, L, db.payments);
                if (err) throw apiError(err);
            }
            if (col === 'payments') {
                if (!payPartner(L, rec)) throw apiError('Đối tác không tồn tại');
                if (rec.staffId && (rec.type !== 'customer' || !L.staff.byId[String(rec.staffId)])) throw apiError('Nhân viên thu tiền không hợp lệ');
                if (rec.type !== 'customer') rec.debtStaffId = '';
                else if (rec.debtStaffId && rec.debtStaffId !== 'none' && !L.staff.byId[String(rec.debtStaffId)]) throw apiError('Nhân viên cho nợ không hợp lệ');
                rec.amount = num(rec.amount);
                if (rec.amount <= 0) throw apiError('Số tiền phải lớn hơn 0');
                linkPayment(rec, L);
                { const err = paymentDebtError(db.records, db.payments, L, rec) || (existing ? cashGuardError(L, db.records, db.payments, db.records, replaceIn(db.payments, existing, rec), [String(existing.staffId || ''), String(rec.staffId || '')], 'sửa') : null); if (err) throw apiError(err); }
            }
            if (STATUS_COLS.includes(col)) setStatus(rec, user.role === 'admin' ? 'approved' : 'pending');
            if (MASTER_TEXT[col]) {
                const err = validateMaster(col, rec, list);
                if (err) throw apiError(err);
            }
            if (col === 'users') {
                rec.username = String(rec.username || '').trim().toLowerCase();
                if (!/^[a-z0-9._-]{3,30}$/.test(rec.username)) throw apiError('Tên đăng nhập 3-30 ký tự: chữ thường không dấu, số, dấu . _ -');
                if (list.some(u => u.username === rec.username && String(u.id) !== String(rec.id))) throw apiError('Tên đăng nhập đã tồn tại');
                if (rec.role === 'giaohang' && !L.staff.byId[String(rec.staffId)]) throw apiError('Tài khoản NV giao hàng phải gắn với 1 nhân viên');
                if (rec.role !== 'giaohang') rec.staffId = rec.staffId || '';
                if (item.password) { if (item.password.length < 6) throw apiError('Mật khẩu tối thiểu 6 ký tự'); rec.password = item.password; }
                else if (existing) rec.password = existing.password;
                else throw apiError('Vui lòng đặt mật khẩu cho tài khoản mới');
                if (existing && existing.id === me.id && (rec.role !== 'admin' || !rec.active)) throw apiError('Không thể tự hạ quyền hoặc khóa tài khoản đang đăng nhập');
            }
            if (existing) list[idx] = rec; else list.unshift(rec);
            if (MASTER_TEXT[col]) migrateLinksInPlace(db); // đổi tên => cập nhật mọi phiếu
            save();
            return { item: col === 'users' ? pub(rec) : rec };
        }
        case 'review': {
            if (!canDelete(user)) throw apiError('Chỉ quản trị viên được duyệt phiếu', 'PERM');
            const results = [];
            (p.items || []).forEach(it => {
                try {
                    if (!STATUS_COLS.includes(it.collection)) throw apiError('Loại dữ liệu không duyệt được');
                    const rec = (db[it.collection] || []).find(x => String(x.id) === String(it.id));
                    if (!rec) throw apiError('Không tìm thấy phiếu (có thể đã bị xóa)');
                    if (p.decision === 'approve') {
                        if (it.collection === 'records') { const err = stockError(rec, db.records, buildLinks(db), false); if (err) throw apiError(err); }
                        setStatus(rec, 'approved');
                    } else setStatus(rec, 'rejected', p.reason);
                    results.push({ collection: it.collection, id: it.id, ok: true, item: rec });
                } catch (e) { results.push({ collection: it.collection, id: it.id, ok: false, error: e.message }); }
            });
            save();
            return { results };
        }
        case 'relink': {
            if (!canDelete(user)) throw apiError('Chỉ quản trị viên được gán liên kết', 'PERM');
            const info = KIND_INFO[p.kind];
            if (!info || !buildLinks(db)[info.link].byId[String(p.toId)]) throw apiError('Không tìm thấy mục để gán');
            const count = relinkInPlace(db, p.kind, p.fromText, p.toId);
            save();
            return { count };
        }
        case 'remove': {
            const target = (db[p.collection] || []).find(x => String(x.id) === String(p.id));
            if (p.collection === 'payments' && target) { const err = cashGuardError(buildLinks(db), db.records, db.payments, db.records, replaceIn(db.payments, target, null), [String(target.staffId || '')], 'xóa'); if (err) throw apiError(err); }
            if (p.collection === 'records' && target) { const err = timelineError(db.records, buildLinks(db), null, target, true) || debtGuardError(db.records, db.payments, buildLinks(db), null, target) || cashGuardError(buildLinks(db), db.records, db.payments, replaceIn(db.records, target, null), db.payments, [idOf(recStaff(buildLinks(db), target))], 'xóa'); if (err) throw apiError(err); }
            if (!canRemove(user, p.collection, target)) throw apiError('Bạn không có quyền xóa dữ liệu này (phiếu đã duyệt chỉ quản trị viên được xóa)', 'PERM');
            if (p.collection === 'users' && String(p.id) === String(me.id)) throw apiError('Không thể xóa tài khoản đang đăng nhập');
            if (MASTER_TEXT[p.collection]) {
                const n = countRefs(db, p.collection, p.id);
                if (n) throw apiError(`Đang được dùng trong ${n} phiếu/thanh toán/tài khoản nên không thể xóa. Hãy đổi tên thay vì xóa.`);
            }
            db[p.collection] = (db[p.collection] || []).filter(x => String(x.id) !== String(p.id));
            save();
            return {};
        }
        case 'changePassword': {
            if (me.password !== p.oldPassword) throw apiError('Mật khẩu hiện tại không đúng');
            if (!p.newPassword || p.newPassword.length < 6) throw apiError('Mật khẩu mới tối thiểu 6 ký tự');
            me.password = p.newPassword; save();
            return {};
        }
        case 'bulkImport': {
            if (!canDelete(user)) throw apiError('Chỉ quản trị viên được nhập dữ liệu hàng loạt', 'PERM');
            const summary = {};
            COLLECTION_KEYS.forEach(k => {
                if (!Array.isArray(p.data[k]) || !p.data[k].length) return;
                let added = 0, updated = 0;
                p.data[k].forEach(it => {
                    const rec = { ...it, id: String(it.id || newId()), createdBy: it.createdBy || user.username, createdAt: it.createdAt || now };
                    const i = (db[k] || []).findIndex(x => String(x.id) === rec.id);
                    if (i >= 0) { db[k][i] = rec; updated++; } else { (db[k] = db[k] || []).push(rec); added++; }
                });
                summary[k] = { added, updated };
            });
            migrateLinksInPlace(db);
            save();
            return { summary };
        }
        default: throw apiError('Hành động không hợp lệ');
    }
}

const LBL = 'block text-xs font-bold text-slate-500 uppercase mb-1';

// Bảng dữ liệu: 10 dòng/trang; khung cao tối đa 75% màn hình để thanh cuộn ngang luôn ở trong tầm nhìn; tiêu đề cột dính khi cuộn.
// Dòng có key bắt đầu bằng '__' (dòng tổng) luôn hiện ở cuối mỗi trang.
const PAGE_SIZE = (typeof window !== 'undefined' && window.TABLE_PAGE_SIZE) || 10;
function DataTable({ heads, rows, emptyText }) {
    const all = [].concat(rows || []).filter(Boolean);
    const pinned = all.filter(r => r && r.key != null && String(r.key).startsWith('__'));
    const body = all.filter(r => !pinned.includes(r));
    const pages = Math.max(1, Math.ceil(body.length / PAGE_SIZE));
    const [page, setPage] = useState(1);
    const [seenLen, setSeenLen] = useState(body.length);
    if (seenLen !== body.length) { setSeenLen(body.length); setPage(1); } // đổi bộ lọc -> về trang 1
    const cur = Math.min(page, pages);
    const shown = body.slice((cur - 1) * PAGE_SIZE, cur * PAGE_SIZE).concat(pinned);
    const pbtn = (label, to, dis, on) => h('button', { key: label + to, type: 'button', disabled: dis, onClick: () => setPage(to),
        className: `min-w-[2.25rem] px-2.5 py-1.5 rounded-lg text-sm font-bold disabled:opacity-30 ${on ? 'bg-slate-900 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}` }, label);
    const nums = [];
    for (let i = Math.max(1, cur - 2); i <= Math.min(pages, cur + 2); i++) nums.push(pbtn(String(i), i, false, i === cur));
    return h('div', null,
        h('div', { className: 'overflow-auto max-h-[75vh] rounded-lg' },
            h('table', { className: 'w-full text-left' },
                h('thead', { className: 'bg-slate-50 text-xs font-bold text-slate-600 uppercase border-b sticky top-0 z-10' },
                    h('tr', null, heads.map((x, i) => h('th', { key: i, className: 'p-3 whitespace-nowrap bg-slate-50 ' + (x[1] || '') }, x[0])))),
                h('tbody', { className: 'divide-y text-sm' },
                    shown.length ? shown : h('tr', null, h('td', { colSpan: heads.length, className: 'p-6 text-center text-slate-400' }, emptyText || 'Chưa có dữ liệu'))))),
        pages > 1 ? h('div', { className: 'flex flex-wrap items-center justify-between gap-2 pt-3' },
            h('span', { className: 'text-sm text-slate-500' }, `Trang ${cur}/${pages} · ${body.length} dòng`),
            h('div', { className: 'flex flex-wrap gap-1' },
                pbtn('«', 1, cur === 1), pbtn('‹', cur - 1, cur === 1), nums, pbtn('›', cur + 1, cur === pages), pbtn('»', pages, cur === pages))) : null);
}
function table(heads, rows, emptyText) { return h(DataTable, { key: 'tb:' + heads.map(x => typeof x[0] === 'string' ? x[0] : '·').join('|'), heads, rows, emptyText }); }

function LoginScreen({ apiUrl, onSaveApiUrl, onLoggedIn }) {
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [showPw, setShowPw] = useState(false);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState('');
    const [showCfg, setShowCfg] = useState(false);
    const [urlDraft, setUrlDraft] = useState(apiUrl);
    const [testMsg, setTestMsg] = useState('');

    const quickLogin = async (u, p) => {
        setUsername(u); setPassword(p); setError(''); setBusy(true);
        try { const res = await localApi('login', { username: u, password: p }); setBusy(false); onLoggedIn({ token: res.token, user: res.user, apiUrl }); }
        catch (err) { setError(err.message); setBusy(false); }
    };
    const submit = async e => {
        e.preventDefault();
        setError(''); setBusy(true);
        try {
            if (!password) { setError('Vui lòng nhập mật khẩu'); setBusy(false); return; }
            const res = apiUrl ? await remoteCall(apiUrl, 'login', { username: 'admin', password }) : await localApi('login', { username: 'admin', password });
            setBusy(false);
            onLoggedIn({ token: res.token, user: res.user, apiUrl });
        } catch (err) { setError(err.message); setBusy(false); }
    };

    const testUrl = async () => {
        const u = urlDraft.trim();
        if (!u) { setTestMsg('Chưa nhập URL'); return; }
        setTestMsg('Đang kiểm tra...');
        try { const r = await remoteCall(u, 'ping'); setTestMsg(`✅ Kết nối thành công (API v${r.version})`); }
        catch (e) { setTestMsg('❌ ' + e.message); }
    };

    return h('div', { className: 'min-h-screen flex items-center justify-center p-4' },

                ),

                    error ? h('div', { className: 'p-3 rounded-xl bg-red-50 text-red-700 text-sm font-semibold' }, h('i', { className: 'fas fa-circle-exclamation mr-2' }), error) : null,

                        h('p', { className: 'text-xs text-slate-400' }, 'Để trống rồi bấm Lưu = quay về chế độ thử nghiệm.')) : null
                )

}

    const [khoPop, setKhoPop] = useState(null); // hộp thoại chi tiết ô báo cáo Kho Hàng: ton | nhap | xuat | nv | dt
    const [cfView, setCfView] = useState('all'); // Lịch sử Thu/Chi: all | in | out
    const [sqHidden, setSqHidden] = useState(() => { try { return JSON.parse(localStorage.getItem('bh_sq_fold') || '{}') || {}; } catch (e) { return {}; } });

    const [ghForm, setGhForm] = useState(blankGh());

    const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
    // Hộp thoại ngay trong app (thay confirm/prompt của trình duyệt — trang chia sẻ không cho dùng hộp thoại đó)
    const [dialog, setDialog] = useState(null);

    const closeDialog = result => { if (dialog) dialog.resolve(result); setDialog(null); };
    const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
    };

    /* ---------- Gọi API ---------- */
    const api = (action, payload) => isRemote
        ? remoteCall(apiUrl, action, payload, session && session.token)
        : localApi(action, payload, session && session.token);

    const clearSession = () => { if (cacheKey) lsDel(cacheKey); verRef.current = ''; lsDel('bh_scope'); setScopeRaw(null); lsDel('bh_session'); setSession(null); setDb(EMPTY_DB); setLoaded(false); setActiveTab('home'); setGhForm(blankGh()); };

    const handleError = err => {
        if (err && err.code === 'AUTH') { showToast(err.message, 'error'); clearSession(); return; }
        showToast((err && err.message) || 'Có lỗi xảy ra', 'error');
    };

    /* ---------- HÀNG CHỜ ĐỒNG BỘ (khi dùng Google Sheet) ----------
       Lưu phiếu => hiện ngay trên app + vào hàng chờ; app tự gửi nền và GỘP nhiều thao tác vào 1 lần gửi.
       Hàng chờ lưu trên máy (localStorage) theo từng tài khoản: mất mạng / đóng tab vẫn không mất, mở lại sẽ gửi tiếp. */
    const QUEUE_COLS = ['records', 'payments', 'expenses', 'cashflows', 'categories', 'suppliers', 'customers', 'staffs', 'warehouses'];
    const outboxKey = session && session.user ? `bh_outbox::${apiUrl}::${session.user.username}` : '';
    const [outbox, setOutboxState] = useState([]);
    const outboxRef = useRef([]);
    const flushing = useRef(false);
    const inflight = useRef(new Set());
    const retryTimer = useRef(null);
    const syncSeq = useRef(0);
    const [syncState, setSyncState] = useState('idle'); // idle | syncing | offline (mất mạng) | stuck (máy chủ lỗi)
    const [syncErr, setSyncErr] = useState('');
    const legacyWarned = useRef(false);
    const [syncPanel, setSyncPanel] = useState(false);
    const setOutbox = list => { outboxRef.current = list; setOutboxState(list); if (outboxKey) lsSet(outboxKey, JSON.stringify(list)); };
    useEffect(() => {
        const saved = outboxKey ? (lsJson(outboxKey) || []) : [];
        outboxRef.current = saved; setOutboxState(saved);
    }, [outboxKey]);

    // Áp các thao tác chưa gửi xong lên dữ liệu tải từ Sheet (để tải lại không làm mất phiếu đang chờ)
    const applyOutbox = (data, ops) => {
        const out = { ...data };
        ops.forEach(o => {
            if (o.action === 'save') out[o.collection] = upsertArr(out[o.collection], { ...o.local, _sync: o.error ? 'error' : 'pending', _syncError: o.error || '' });
            if (o.action === 'remove') out[o.collection] = (out[o.collection] || []).filter(x => String(x.id) !== String(o.id));
            if (o.action === 'review') (o.items || []).forEach(it => {
                out[it.collection] = (out[it.collection] || []).map(x => String(x.id) === String(it.id) ? { ...x, ...o.patch, _sync: o.error ? 'error' : 'pending', _syncError: o.error || '' } : x);

    // silent: tải nền (không hiện vòng chờ); force: bỏ qua so phiên bản, đọc lại toàn bộ Sheet
    const loadAll = async (silent, force) => {
        if (silent !== true) silent = false;
        if (!silent) setLoading(true);
        const seq = syncSeq.current;
        try {
            const res = await api('getAll', !isRemote ? {} : force === true ? { force: true } : { ver: verRef.current });
            if (res.same) { setLastSync(new Date().toLocaleTimeString('vi-VN')); setLoaded(true); } // không có gì mới: không tải, không vẽ lại
            // tải nền mà trong lúc đó vừa gửi xong 1 đợt => bỏ kết quả cũ, lần sau tải lại
            else if (!(silent && seq !== syncSeq.current)) {
                verRef.current = res.ver || '';
                const data = normalizeDb({ ...EMPTY_DB, ...(res.data || {}) });
                setDb(isRemote ? applyOutbox(data, outboxRef.current) : data);
                if (res.user && session && JSON.stringify(res.user) !== JSON.stringify(session.user)) {
                    const s = { ...session, user: res.user };
                    setSession(s); lsSet('bh_session', JSON.stringify(s));
                }
                setLastSync(new Date().toLocaleTimeString('vi-VN'));
                setLoaded(true);
            }
        } catch (e) { if (!silent || e.code === 'AUTH') handleError(e); }
        if (!silent) setLoading(false);
    };

    useEffect(() => {
        if (!session) return;
        const c = isRemote ? lsJson(cacheKey) : null;
        if (c && c.db) {
            // Có dữ liệu lần trước trên máy => hiện ngay, hỏi Sheet có gì mới ở nền
            verRef.current = c.ver || '';

            setLoaded(true);
            loadAll(true);
        } else { verRef.current = ''; loadAll(); }
    }, [session && session.token]);
    // Ghi bộ nhớ đệm khi máy rảnh (không làm giật thao tác); rời / đóng app thì ghi ngay
    const cacheDirty = useRef(false), dbRef = useRef(db);
    dbRef.current = db;
    const writeCache = () => {
        if (!cacheKey || !cacheDirty.current) return;
        cacheDirty.current = false;
        const d = {}, cur = dbRef.current;
        COLLECTION_KEYS.forEach(k => { d[k] = (cur[k] || []).map(x => x && x._sync ? (({ _sync, _syncError, ...r }) => r)(x) : x); });
        lsSet(cacheKey, JSON.stringify({ ver: verRef.current, at: Date.now(), db: d }));
    };
    useEffect(() => {
        if (!cacheKey || !loaded) return;
        cacheDirty.current = true;
        const t = setTimeout(() => { window.requestIdleCallback ? window.requestIdleCallback(writeCache, { timeout: 4000 }) : writeCache(); }, 1200);
        return () => clearTimeout(t);
    }, [db, loaded, cacheKey]);
    useEffect(() => {
        const onHide = () => { if (document.visibilityState === 'hidden') writeCache(); };
        document.addEventListener('visibilitychange', onHide); window.addEventListener('pagehide', writeCache);
        return () => { document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', writeCache); };
    }, [cacheKey]);

    const queueOp = op => {
        setOutbox([...outboxRef.current, { qid: newId(), at: new Date().toISOString(), ...op }]);
        clearTimeout(retryTimer.current);
        retryTimer.current = setTimeout(() => flush(), 400); // chờ 0,4 giây để gom các phiếu nhập liên tiếp
    };

    // Gửi 1 đợt thao tác. Máy chủ bản mới: 1 lần gọi "batch". Máy chủ bản cũ (chưa triển khai Code.gs mới): tự gửi từng thao tác.
    const sendOps = async batch => {
        const ops = batch.map(({ local, patch, error, at, isNew, ...op }) => op);
        try {
            const resp = await remoteCall(apiUrl, 'batch', { ops }, session.token);
            // Không ai khác ghi xen giữa => dữ liệu trên máy đã khớp phiên bản mới, lần kiểm tra sau khỏi tải lại
            if (resp.ver && resp.prevVer && verRef.current && resp.prevVer === verRef.current) { verRef.current = resp.ver; cacheDirty.current = true; }
            return resp.results || [];
        } catch (e) {
            if (e.code === 'NET' || e.code === 'AUTH' || !/Hành động không hợp lệ/.test(e.message || '')) throw e;
            if (!legacyWarned.current) {
                legacyWarned.current = true;
                showToast('Google Sheet đang chạy Code.gs bản cũ — app vẫn gửi được nhưng chậm hơn. Hãy Triển khai → Phiên bản mới cho Code.gs.', 'error');
            }
            const results = [];
            for (const op of ops) {
                try {
                    if (op.action === 'save') results.push({ qid: op.qid, ok: true, item: (await remoteCall(apiUrl, 'save', { collection: op.collection, item: op.item }, session.token)).item });
                    else if (op.action === 'remove') { await remoteCall(apiUrl, 'remove', { collection: op.collection, id: op.id }, session.token); results.push({ qid: op.qid, ok: true }); }
                    else if (op.action === 'review') results.push({ qid: op.qid, ok: true, results: (await remoteCall(apiUrl, 'review', { items: op.items, decision: op.decision, reason: op.reason }, session.token)).results });
                } catch (err) {
                    if (err.code === 'NET' || err.code === 'AUTH') throw err;
                    results.push({ qid: op.qid, ok: false, error: err.message });
                }
            }
            return results;
        }
    };

    const flush = async () => {
        if (flushing.current || !isRemote || !session) return;
        const ready = outboxRef.current.filter(o => !o.error);
        if (!ready.length) { setSyncState('idle'); return; }
        flushing.current = true; setSyncState('syncing');
        const batch = ready.slice(0, 20);
        batch.forEach(o => inflight.current.add(o.qid));
        let again = false;
        try {
            const results = await sendOps(batch);
            syncSeq.current++;
            setSyncErr('');
            const byQ = {}; results.forEach(r => { byQ[r.qid] = r; });
            let list = outboxRef.current;
            const updates = [], reviewErrors = [];
            batch.forEach(o => {
                const r = byQ[o.qid]; if (!r) return;
                const ok = r.ok || (o.action === 'remove' && /Không tìm thấy/.test(r.error || ''));
                if (ok) {
                    list = list.filter(x => x.qid !== o.qid);
                    if (o.action === 'save' && r.item) updates.push({ col: o.collection, item: r.item });
                    if (o.action === 'review') (r.results || []).forEach(x => x.ok ? updates.push({ col: x.collection, item: x.item }) : reviewErrors.push(x.error));
                } else list = list.map(x => x.qid === o.qid ? { ...x, error: r.error || 'Lỗi không rõ' } : x);
            });
            setOutbox(list);
            // Còn thao tác lưu mới hơn cho cùng phiếu trong hàng chờ => giữ bản trên máy
            const stillQueued = new Set(list.filter(x => x.action === 'save').map(x => x.collection + ':' + x.local.id));
            setDb(prev => {
                const next = { ...prev };
                updates.forEach(u => { if (!stillQueued.has(u.col + ':' + u.item.id)) next[u.col] = upsertArr(next[u.col], normalizeItem(u.col, u.item)); });
                list.filter(x => x.error && x.action === 'save').forEach(x => { next[x.collection] = upsertArr(next[x.collection], { ...x.local, _sync: 'error', _syncError: x.error }); });
                return next;
            });
            const errs = list.filter(x => x.error).length;
            if (errs) showToast(`${errs} thao tác gửi lỗi — bấm "Lỗi đồng bộ" ở thanh bên để xem`, 'error');
            if (reviewErrors.length) { showToast(`Không duyệt được ${reviewErrors.length} phiếu: ${reviewErrors[0]}`, 'error'); setTimeout(() => loadAll(true), 100); }
            setLastSync(new Date().toLocaleTimeString('vi-VN'));
            again = list.some(x => !x.error);
            setSyncState(again ? 'syncing' : 'idle');
        } catch (e) {
            batch.forEach(o => inflight.current.delete(o.qid));
            flushing.current = false;
            if (e.code === 'AUTH') { handleError(e); return; }
            // Phân biệt: thật sự mất mạng hay máy chủ trả lỗi
            const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
            setSyncState(offline ? 'offline' : 'stuck');
            setSyncErr(offline ? '' : (e.message || 'Lỗi không rõ'));
            clearTimeout(retryTimer.current);
            retryTimer.current = setTimeout(() => flush(), 15000); // mất mạng: 15 giây thử lại
            return;
        }
        batch.forEach(o => inflight.current.delete(o.qid));
        flushing.current = false;
        if (again) setTimeout(() => flush(), 50);
    };

    // Tự gửi khi có mạng lại; mỗi phút tải dữ liệu mới của người khác; cảnh báo khi đóng tab còn phiếu chưa gửi
    useEffect(() => {
        if (!isRemote || !session || !loaded) return;
        flush();
        const onOnline = () => flush();
        const onBeforeUnload = e => { if (outboxRef.current.some(o => !o.error)) { e.preventDefault(); e.returnValue = ''; } };
        const onVisible = () => { if (document.visibilityState === 'visible' && !flushing.current && !outboxRef.current.length) loadAll(true); };
        window.addEventListener('online', onOnline);
        window.addEventListener('beforeunload', onBeforeUnload);
        document.addEventListener('visibilitychange', onVisible);
        const iv = setInterval(() => {
            if (outboxRef.current.some(o => !o.error)) flush();
            else if (!flushing.current && document.visibilityState !== 'hidden') loadAll(true);
        }, 30000); // kiểm tra rất nhẹ (chỉ so số phiên bản) nên 30 giây/lần
        return () => {
            window.removeEventListener('online', onOnline);
            window.removeEventListener('beforeunload', onBeforeUnload);
            document.removeEventListener('visibilitychange', onVisible);
            clearInterval(iv);
        };
    }, [isRemote, session && session.token, loaded]);

    const saveItem = async (col, item) => {
        if (isRemote && QUEUE_COLS.includes(col)) {
            // Lưu tức thì trên máy, gửi nền. Kiểm tra giống máy chủ để hạn chế lỗi khi gửi.
            const now = new Date().toISOString();
            const existing = (db[col] || []).find(x => String(x.id) === String(item.id));
            const rec = { ...(existing || {}), ...item, id: String(item.id || newId()) };
            delete rec._sync; delete rec._syncError;
            if (!existing) { rec.createdBy = user.username; rec.createdAt = now; }
            rec.updatedBy = user.username; rec.updatedAt = now;
            if (user.role === 'giaohang') { rec.staffId = String(user.staffId || ''); if (col === 'payments') rec.debtStaffId = rec.staffId; }
            if (col === 'records') { const err = prepareRecordLocal(rec, db.records || [], L, db.payments || []); if (err) { showToast(err, 'error'); return null; } }
            if (col === 'payments') { const err = paymentDebtError(db.records, db.payments, L, rec) || (existing ? cashGuardError(L, db.records, db.payments, db.records, replaceIn(db.payments, existing, rec), [String(existing.staffId || ''), String(rec.staffId || '')], 'sửa') : null); if (err) { showToast(err, 'error'); return null; } }
            if (STATUS_COLS.includes(col)) {
                const adm = user.role === 'admin';
                Object.assign(rec, { status: adm ? 'approved' : 'pending', approvedBy: adm ? user.username : '', approvedAt: adm ? now : '', rejectReason: '' });
            }
            const local = normalizeItem(col, rec);
            const send = { ...rec };
            ['createdBy', 'createdAt', 'updatedBy', 'updatedAt', 'status', 'approvedBy', 'approvedAt', 'rejectReason'].forEach(k => delete send[k]);
            setDb(prev => ({ ...prev, [col]: upsertArr(prev[col], { ...local, _sync: 'pending' }) }));
            // Sửa lại phiếu còn nằm trong hàng chờ (chưa gửi) => thay luôn thao tác cũ
            const stale = outboxRef.current.find(o => o.action === 'save' && o.collection === col && String(o.local.id) === rec.id && !inflight.current.has(o.qid));
            if (stale) {
                setOutbox(outboxRef.current.map(o => o.qid === stale.qid ? { ...o, item: send, local, error: '' } : o));

            } else queueOp({ action: 'save', collection: col, item: send, local, isNew: !existing || outboxRef.current.some(o => o.action === 'save' && o.isNew && String(o.local.id) === rec.id) });
            return local;
        }

        try {
            const res = await api('save', { collection: col, item });
            setDb(prev => ({ ...prev, [col]: upsertArr(prev[col], normalizeItem(col, res.item)) }));
            return res.item;
        } catch (e) { handleError(e); return null; }
        finally { setBusy(false); }
    };

    const removeItem = async (col, id, confirmText) => {
        if (col === 'payments') {

            const mine = outboxRef.current.filter(o => o.action === 'save' && o.collection === col && String(o.local.id) === String(id));
            const neverSent = mine.length && mine.some(o => o.isNew) && !mine.some(o => inflight.current.has(o.qid));
            if (neverSent) setOutbox(outboxRef.current.filter(o => !mine.includes(o))); // chưa lên Sheet => chỉ cần bỏ khỏi hàng chờ

    const handleLoggedIn = s => { lsSet('bh_session', JSON.stringify(s)); setSession(s); setActiveTab('home'); };

    };

    const demoBar = () => null;

    // Hàng chọn kho của tab Kho Hàng: Kho: Tất cả · Kho 1 · Kho 2 · [Chuyển kho]
